
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Moniteur</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<div class="form-container">
    <form id="moniteurForm" data-form="moniteurs">
        <fieldset>
            <legend>Moniteur</legend>

            <div class="form-group">
                <label for="idMoniteur">Identifiant Moniteur :</label>
                <input type="text" id="idMoniteur" name="identifiant" required>
            </div>

            <div class="form-group">
                <label for="nomMoniteur">Nom & Prénom :</label>
                <input type="text" id="nomMoniteur" name="nom" required>
            </div>

            <div class="form-group">
                <label for="dateEmbauche">Date d'embauche :</label>
                <input type="date" id="dateEmbauche" name="date" required>
            </div>

            <button type="submit">Ajouter</button>
            <button type="reset">Annuler</button>

            <p class="message" aria-live="polite"></p>
        </fieldset>
    </form>
</div>

<div class="records">
    <h3>Liste des moniteurs</h3>
    <ul id="moniteursList"></ul>
</div>

<script src="../assets/js/app.js"></script>
</body>
</html>
